x-app: &app
  build: .
  image: tcg-sniper
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://tcg:tcg@postgres:5432/tcg
    DIR_DADOS: /data
    EVOLUTION_URL: http://evolution:8080
    # Relógio da área de trabalho do noVNC e horário dos logs. O código não depende disso:
    # datas e agendamento usam o fuso de Configurações → Geral.
    TZ: America/Sao_Paulo
  volumes:
    - dados:/data
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tcg
      POSTGRES_PASSWORD: tcg
      POSTGRES_DB: tcg
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcg"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  evolution:
    # v2.3.7: última versão estável (2.4.0 ainda é release candidate). Postgres sem Redis.
    image: evoapicloud/evolution-api:v2.3.7
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://tcg:tcg@postgres:5432/evolution?schema=public
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
    volumes:
      - evolution:/evolution/instances
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    <<: *app
    command: tcg-sniper migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  coletor-liga:
    <<: *app
    entrypoint: ["/app/docker/coletor-entrypoint.sh"]
    command: ["tcg-sniper", "coletor-liga"]
    # tini repassa o SIGTERM e recolhe Xvfb/x11vnc/websockify/fluxbox; o hostname fixo
    # mantém válido o SingletonLock do perfil do Chromium entre recriações do container.
    init: true
    hostname: coletor-liga
    stop_grace_period: 30s
    shm_size: 1gb
    ports:
      - "6080:6080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  coletor-amazon:
    <<: *app
    entrypoint: ["/app/docker/coletor-entrypoint.sh"]
    command: ["tcg-sniper", "coletor-amazon"]
    environment:
      DATABASE_URL: postgresql+psycopg://tcg:tcg@postgres:5432/tcg
      DIR_DADOS: /data
      EVOLUTION_URL: http://evolution:8080
      TZ: America/Sao_Paulo
      DIR_PERFIL: /data/perfil-amazon
    # Mesmo arranjo do coletor-liga: tini, hostname fixo para o SingletonLock do perfil e o noVNC
    # da Amazon na porta 6081 do host (a 6080 é da Liga).
    init: true
    hostname: coletor-amazon
    stop_grace_period: 30s
    shm_size: 1gb
    ports:
      - "6081:6080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  notificador:
    <<: *app
    command: tcg-sniper notificador
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

  casador:
    <<: *app
    command: tcg-sniper casador
    stop_grace_period: 90s
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin:
    <<: *app
    command: tcg-sniper admin
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  dados:
  evolution:
