x-app: &app
  build: .
  image: tcg-sniper
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://tcg:tcg@postgres:5432/tcg
    DIR_DADOS: /data
    EVOLUTION_URL: http://evolution:8080
    # Relógio da área de trabalho do noVNC e horário dos logs. O código não depende disso:
    # datas e agendamento usam o fuso de Configurações → Geral.
    TZ: America/Sao_Paulo
  volumes:
    - dados:/data
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tcg
      POSTGRES_PASSWORD: tcg
      POSTGRES_DB: tcg
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcg"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Postgres só de testes: bancos descartáveis (tcg_test, tcg_test_<lane>), dados em memória.
  # Nada depende dele; separado do Postgres de produção para os testes nunca tocarem nos dados reais.
  postgres-teste:
    image: postgres:16
    environment:
      POSTGRES_USER: tcg
      POSTGRES_PASSWORD: tcg
      POSTGRES_DB: tcg_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcg -d tcg_test"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  evolution:
    # v2.3.7: última versão estável (2.4.0 ainda é release candidate). Postgres sem Redis.
    image: evoapicloud/evolution-api:v2.3.7
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://tcg:tcg@postgres:5432/evolution?schema=public
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
    volumes:
      - evolution:/evolution/instances
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    <<: *app
    command: tcg-sniper migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  coletor-liga:
    <<: *app
    entrypoint: ["/app/docker/coletor-entrypoint.sh"]
    command: ["tcg-sniper", "coletor-liga"]
    # tini repassa o SIGTERM e recolhe Xvfb/x11vnc/websockify/fluxbox; o hostname fixo
    # mantém válido o SingletonLock do perfil do Chromium entre recriações do container.
    init: true
    hostname: coletor-liga
    stop_grace_period: 30s
    shm_size: 1gb
    ports:
      - "6080:6080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  coletor-amazon:
    <<: *app
    entrypoint: ["/app/docker/coletor-entrypoint.sh"]
    command: ["tcg-sniper", "coletor-amazon"]
    environment:
      DATABASE_URL: postgresql+psycopg://tcg:tcg@postgres:5432/tcg
      DIR_DADOS: /data
      EVOLUTION_URL: http://evolution:8080
      TZ: America/Sao_Paulo
      DIR_PERFIL: /data/perfil-amazon
    # Mesmo arranjo do coletor-liga: tini, hostname fixo para o SingletonLock do perfil e o noVNC
    # do monitor da Amazon (navegador logado) na porta 6081 do host (a 6080 é da Liga, a 6082 da busca).
    init: true
    hostname: coletor-amazon
    stop_grace_period: 30s
    shm_size: 1gb
    ports:
      - "6081:6080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  coletor-amazon-busca:
    <<: *app
    entrypoint: ["/app/docker/coletor-entrypoint.sh"]
    command: ["tcg-sniper", "coletor-amazon-busca"]
    environment:
      DATABASE_URL: postgresql+psycopg://tcg:tcg@postgres:5432/tcg
      DIR_DADOS: /data
      EVOLUTION_URL: http://evolution:8080
      TZ: America/Sao_Paulo
      DIR_PERFIL: /data/perfil-amazon-busca
    # Busca de anúncios novos num navegador próprio, sem login (perfil separado do monitor, que fica
    # logado). Mesmo arranjo dos outros coletores: tini, hostname fixo para o SingletonLock do perfil e o
    # noVNC na porta 6082 do host (6080 é da Liga, 6081 do monitor da Amazon).
    init: true
    hostname: coletor-amazon-busca
    stop_grace_period: 30s
    shm_size: 1gb
    ports:
      - "6082:6080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  notificador:
    <<: *app
    command: tcg-sniper notificador
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

  casador:
    <<: *app
    command: tcg-sniper casador
    stop_grace_period: 120s
    depends_on:
      migrate:
        condition: service_completed_successfully

  manutencao:
    <<: *app
    command: tcg-sniper manutencao
    # Backup diário do banco (04:00) e limpeza do histórico. Os arquivos ficam em ./dados/backups
    # no PC, junto dos backups manuais tcg-antes-*.dump (o rodízio não toca neles).
    environment:
      DATABASE_URL: postgresql+psycopg://tcg:tcg@postgres:5432/tcg
      DIR_DADOS: /data
      DIR_BACKUPS: /backups
      EVOLUTION_URL: http://evolution:8080
      TZ: America/Sao_Paulo
    volumes:
      - dados:/data
      - ./dados/backups:/backups
    stop_grace_period: 120s
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin:
    <<: *app
    command: tcg-sniper admin
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # API do front novo (JSON, login pelo WhatsApp). Só no 127.0.0.1: quem fala com ela de fora é o Caddy (web).
  api:
    <<: *app
    command: tcg-sniper api --host 0.0.0.0 --porta 8100
    ports:
      - "127.0.0.1:8100:8100"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Front novo (React): Caddy serve o build e repassa /api para o serviço api.
  web:
    build: ./web
    image: tcg-sniper-web
    environment:
      - URL_PUBLICA_IMAGENS=${URL_PUBLICA_IMAGENS:-}
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  dados:
  evolution:
