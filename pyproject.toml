[project]
name = "tcg-sniper"
version = "0.1.0"
description = "Monitor de arbitragem de selados de Magic"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "boto3>=1.35",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "openai>=1.99,<3",
    "patchright>=1.64.3",
    "pillow>=13.0",
    "playwright>=1.64.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "selectolax>=0.3.21",
    "sqlalchemy>=2.0.30",
    "tzdata>=2024.1",
    "uvicorn>=0.30",
]

[tool.uv]
# Dependência indireta (httpx, openai, boto3): versões anteriores confiam em CAs com chaves vazadas (GHSA-6q48-6c7w-9gw2).
constraint-dependencies = ["certifi>=2026.10.19"]

[project.scripts]
tcg-sniper = "tcg_sniper.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcg_sniper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/tcg_sniper/db/migrations/versions"]
